name: Build SmsSense APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run Unit Tests
        working-directory: ./android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Prepare Artifact
        run: |
          mkdir -p output
          VERSION="${GITHUB_REF_NAME:-latest}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/SmsSense-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsSense-APK
          path: output/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          name: SmsSense ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
